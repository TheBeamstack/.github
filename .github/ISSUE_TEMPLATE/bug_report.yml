name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: input
    id: project
    attributes:
      label: Project & version
      placeholder: "e.g. Road-Designer v1.0, or commit sha"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction. Attach sample inputs if relevant.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python/Node version, browser, how you ran it"
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
